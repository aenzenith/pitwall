name: Release

on:
  push:
    branches: [main]
  # By hand, for a release that is already cut: its tag is built again and the files attached.
  # A run started again from the Actions page can't do that: release-please then finds the
  # release made and says none was created, and the builds are skipped.
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag to build again, e.g. v1.7.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  # Conventional Commits decide the next version: feat → minor, fix/perf → patch, feat! → major.
  # The release PR bumps package.json, tauri.conf.json, Cargo.toml and Cargo.lock together.
  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When a release is cut, the app is built from its tag on each platform and the installers are
  # attached to the release. Unsigned until the app is signed (and notarized on macOS).
  #
  # With the updater's key among the secrets (TAURI_SIGNING_PRIVATE_KEY and its password), each
  # installer also gets a signature, and macOS the archive an update is installed from; the
  # `manifest` job then writes `latest.json`. Without the key the release has installers only.
  build:
    name: ${{ matrix.name }} build
    needs: release-please
    # `!cancelled()`: started by hand, release-please is skipped, and so would this be.
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            bundles: app,dmg
            files: src-tauri/target/release/bundle/dmg/*.dmg
            updater: src-tauri/target/release/bundle/macos/*.app.tar.gz src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
            files: src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi
            updater: src-tauri/target/release/bundle/nsis/*.exe.sig src-tauri/target/release/bundle/msi/*.msi.sig
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
            files: src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage
            updater: src-tauri/target/release/bundle/appimage/*.AppImage.sig src-tauri/target/release/bundle/deb/*.deb.sig
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      # The same list as CI, plus what the AppImage bundler needs (as in tauri-action's README).
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sed 's/#.*//' tools/linux-check/packages.txt | xargs sudo apt-get install -y --no-install-recommends patchelf xdg-utils

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.os }}

      - name: Install dependencies
        run: npm ci

      # The override goes in as a file: JSON on the command line doesn't survive npm on Windows.
      - name: Build
        shell: bash
        run: |
          args=(--bundles ${{ matrix.bundles }})
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '{ "bundle": { "createUpdaterArtifacts": true } }' > "$GITHUB_WORKSPACE/updater.conf.json"
            args+=(--config "$GITHUB_WORKSPACE/updater.conf.json")
          fi
          npm run tauri build -- "${args[@]}"

      # The archive is `Pitwall.app.tar.gz` whatever it was built for; the manifest reads the
      # architecture from its name.
      - name: Name the macOS update
        if: runner.os == 'macOS' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        run: |
          arch="$(uname -m)"
          [ "$arch" = arm64 ] && arch=aarch64
          cd src-tauri/target/release/bundle/macos
          mv Pitwall.app.tar.gz "Pitwall_${arch}.app.tar.gz"
          mv Pitwall.app.tar.gz.sig "Pitwall_${arch}.app.tar.gz.sig"

      - name: Attach to release
        shell: bash
        run: |
          shopt -s nullglob
          files=(${{ matrix.files }})
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            files+=(${{ matrix.updater }})
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  # What the installed apps ask for (`plugins.updater.endpoints` in tauri.conf.json): the version
  # and, per system and installer, where its update is and its signature. Written last, from the
  # signatures the release has, so it never names a file that isn't there; a platform whose build
  # failed is left out and the others still update.
  manifest:
    name: Update manifest
    needs: [release-please, build]
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Write latest.json
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir sigs
          gh release download "$TAG" --pattern '*.sig' --dir sigs || true

          base="https://github.com/$GH_REPO/releases/download/$TAG"
          platforms='{}'
          add() {
            platforms="$(jq --arg key "$1" --arg url "$base/$(basename "${2%.sig}")" --arg signature "$(cat "$2")" \
              '. + {($key): {signature: $signature, url: $url}}' <<<"$platforms")"
          }

          for sig in sigs/*.app.tar.gz.sig; do
            name="$(basename "$sig" .app.tar.gz.sig)"
            add "darwin-${name##*_}" "$sig"
          done
          # The plain key is what a build that doesn't know its installer asks for.
          for sig in sigs/*-setup.exe.sig; do add windows-x86_64 "$sig"; add windows-x86_64-nsis "$sig"; done
          for sig in sigs/*.msi.sig; do add windows-x86_64-msi "$sig"; done
          for sig in sigs/*.AppImage.sig; do add linux-x86_64 "$sig"; add linux-x86_64-appimage "$sig"; done
          for sig in sigs/*.deb.sig; do add linux-x86_64-deb "$sig"; done

          if [ "$platforms" = '{}' ]; then
            echo "No signatures on $TAG: no update manifest."
            exit 0
          fi

          jq -n --arg version "${TAG#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson platforms "$platforms" \
            '{version: $version, pub_date: $date, platforms: $platforms}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber
