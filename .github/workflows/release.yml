name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Conventional Commits decide the next version: feat → minor, fix/perf → patch, feat! → major.
  # The release PR bumps package.json, tauri.conf.json, Cargo.toml and Cargo.lock together.
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When a release is cut, the app is built from its tag on each platform and the installers are
  # attached to the release. Unsigned until the app is signed (and notarized on macOS).
  build:
    name: ${{ matrix.name }} build
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            bundles: dmg
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
            files: src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
            files: src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # The same list as CI, plus what the AppImage bundler needs (as in tauri-action's README).
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sed 's/#.*//' tools/linux-check/packages.txt | xargs sudo apt-get install -y --no-install-recommends patchelf xdg-utils

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.os }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        shell: bash
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Attach to release
        shell: bash
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber
