[package]
name = "pitwall"
version = "1.0.0"
description = "Dev servers and Claude sessions in the menu bar"
authors = ["Mustafa Sarı"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pitwall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }
libc = "0.2.189"
regex = "1.13.1"
notify = "8.2.0"
dirs = "7.0.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
portable-pty = "0.9.0"
sys-locale = "0.3.2"
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }
# The process table (reveal-claude, browsers that run) on macOS, Linux and Windows alike.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Local time (the day's bounds, wall-clock times) on every platform.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-clipboard-manager = "2.4.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.15"
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSArray", "NSError", "NSData"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationAttachment", "UNNotificationTrigger"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "NSApplication", "NSResponder", "NSWindow", "NSPanel", "NSEvent", "NSSound", "block2", "libc"] }

# Pitwall's sounds elsewhere: WAV only. On Linux cpal links ALSA (`libasound2-dev` to build).
[target.'cfg(not(target_os = "macos"))'.dependencies]
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }

# Job objects (a server's whole tree), process times and console-less children; toasts; the
# taskbar's theme.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }
tauri-winrt-notification = "0.8.1"
windows-registry = "0.6.1"

# Notifications over D-Bus, in pure Rust (zbus): no libdbus to build against.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4.18.1", default-features = false, features = ["z"] }
